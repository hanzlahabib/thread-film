<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Streaks - Dayfold</title>
<link rel="stylesheet" href="app.css">
<style>
.big{position:absolute;left:20px;right:20px;top:122px;height:150px;border-radius:24px;background:var(--accent);color:var(--accent-ink);padding:22px 24px}
.big .n{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1}
.big .l{font-size:16px;font-weight:600;margin-top:6px;opacity:.85}
.big svg{position:absolute;right:24px;top:24px;width:44px;height:44px;stroke:var(--accent-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.week{position:absolute;left:20px;right:20px;top:296px;height:96px;padding:14px 16px}
.week .days{display:flex;justify-content:space-between;margin-top:10px}
.dot{width:36px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600}
.dot i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--accent-ink)}
.dot i.on{background:var(--ok)}
.dot i.on svg{width:15px;height:15px;stroke-width:3.2;stroke:var(--bg)}
.habits{position:absolute;left:20px;right:20px;top:420px}
.hb{display:flex;align-items:center;gap:14px;height:64px;padding:0 16px;margin-bottom:10px}
.hb .g{flex:1;min-width:0}
.hb b{display:block;font-size:16px;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hb .c{font-size:13px;font-weight:650;color:var(--muted)}
.hb.hot{border-color:var(--ok);background:var(--ok-soft)}
.hb.hot .c{color:var(--ok)}
.hb.hot .bar i{background:var(--ok)}
</style>
</head>
<body>
<div class="status"><span class="time">9:41</span><span class="sys"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>

<div class="pad" style="top:66px"><h1>Streaks</h1></div>
<div class="big" data-anchor="streak"><div class="n">12</div><div class="l">day streak, your best yet</div><svg viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5 5 9.5a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.2 1 2 2 2 0-3-.5-5 1-7.5Z"/></svg></div>

<div class="week card"><div class="label">This week</div>
  <div class="days">
    <div class="dot"><i class="on"><svg class="ic" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg></i>M</div>
    <div class="dot"><i class="on"><svg class="ic" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg></i>T</div>
    <div class="dot"><i class="on"><svg class="ic" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg></i>W</div>
    <div class="dot"><i></i>T</div>
    <div class="dot"><i></i>F</div>
    <div class="dot"><i></i>S</div>
    <div class="dot"><i></i>S</div>
  </div>
</div>

<div class="habits">
  <div class="card hb hot" data-anchor="habit"><div class="g"><b>Call mum</b><div class="bar"><i style="width:75%"></i></div></div><span class="c">3 / 4</span></div>
  <div class="card hb"><div class="g"><b>Read 20 pages</b><div class="bar"><i style="width:57%"></i></div></div><span class="c">4 / 7</span></div>
  <div class="card hb"><div class="g"><b>Gym</b><div class="bar"><i style="width:66%"></i></div></div><span class="c">2 / 3</span></div>
</div>

<div class="tabs">
  <div><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></svg>Today</div>
  <div><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</div>
  <div class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5 5 9.5a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.2 1 2 2 2 0-3-.5-5 1-7.5Z"/></svg>Streaks</div>
  <div><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>You</div>
</div>
<div class="home"></div>
</body>
</html>
