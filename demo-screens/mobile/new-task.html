<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>New task - Dayfold</title>
<link rel="stylesheet" href="app.css">
<style>
.bar{position:absolute;left:20px;right:20px;top:62px;height:44px;display:flex;align-items:center;justify-content:space-between;font-size:16px}
.bar .c{color:var(--muted)}
.bar b{font-weight:650;font-size:17px}
.bar .s{color:var(--accent-text);font-weight:650}
.field{position:absolute;left:20px;right:20px;top:126px;height:76px;border-radius:18px;background:var(--surface);border:2px solid var(--accent);display:flex;align-items:center;padding:0 18px;font-size:28px;font-weight:650;letter-spacing:-.025em}
.caret{display:inline-block;width:2.5px;height:32px;background:var(--accent);margin-left:2px;border-radius:2px}
.chips{position:absolute;left:20px;right:20px;top:222px;display:flex;gap:10px}
.note{position:absolute;left:20px;right:20px;top:282px;height:64px;border-radius:18px;border:1px dashed var(--border-2);display:flex;align-items:center;padding:0 18px;color:var(--muted);font-size:15px}
.sugg{position:absolute;left:0;right:0;top:466px;height:44px;background:var(--kbd);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;font-size:15px;color:var(--text-2)}
.sugg i{width:1px;height:22px;background:var(--border-2)}
.kbd{position:absolute;left:0;right:0;top:510px;bottom:0;background:var(--kbd);padding:10px 4px 0}
.kr{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.k{width:34px;height:46px;border-radius:7px;background:var(--key);color:var(--key-text);display:grid;place-items:center;font-size:20px;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.k.w{width:48px;background:var(--surface-2);font-size:15px}
.k.sp{width:210px;font-size:15px}
.k.go{width:82px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:650}
</style>
</head>
<body>
<div class="status"><span class="time">9:41</span><span class="sys"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>

<div class="bar"><span class="c">Cancel</span><b>New task</b><span class="s">Add</span></div>
<div class="field" data-anchor="title">Call mum<span class="caret"></span></div>
<div class="chips"><span class="pill">Today</span><span class="pill on" data-anchor="when">6:30 pm</span><span class="pill">Family</span></div>
<div class="note">Add a note</div>

<div class="sugg"><span>Call mum</span><i></i><span>Call</span><i></i><span>Calls</span></div>
<div class="kbd">
  <div class="kr"><div class="k">q</div><div class="k">w</div><div class="k">e</div><div class="k">r</div><div class="k">t</div><div class="k">y</div><div class="k">u</div><div class="k">i</div><div class="k">o</div><div class="k">p</div></div>
  <div class="kr"><div class="k">a</div><div class="k">s</div><div class="k">d</div><div class="k">f</div><div class="k">g</div><div class="k">h</div><div class="k">j</div><div class="k">k</div><div class="k">l</div></div>
  <div class="kr"><div class="k w">&#8679;</div><div class="k">z</div><div class="k">x</div><div class="k">c</div><div class="k">v</div><div class="k">b</div><div class="k">n</div><div class="k">m</div><div class="k w">&#9003;</div></div>
  <div class="kr"><div class="k w">123</div><div class="k sp">space</div><div class="k go">done</div></div>
</div>
<div class="home"></div>
</body>
</html>
